org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

mod_version=0.1.0
game_version=1.21.1
neo_version=21.1.248

# ---- what this fix targets -------------------------------------------------
# The fix keys off net.irisshaders.iris.compat.dh.DHCompatInternal's constructor
# shape and its null-configs bail path. Both are version-specific. Keep these in
# sync with the iris jar actually installed in the pack.
#
# iris_target        short form used in the jar filename
# iris_mod_version   the exact version string Iris declares in its own mods.toml
# iris_version_range the range mods.toml enforces at load time (the lock)
iris_target=1.8.14-beta.1
iris_mod_version=1.8.14-beta.1+mc1.21.1
iris_version_range=[1.8.14-beta.1,1.8.15)
